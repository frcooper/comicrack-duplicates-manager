name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Build
        run: python3 -B tools/build-plugin.py
      - uses: actions/upload-artifact@v7
        with:
          name: DuplicatesManager-plugin
          path: dist/*.crplugin
          if-no-files-found: error
          retention-days: 3
